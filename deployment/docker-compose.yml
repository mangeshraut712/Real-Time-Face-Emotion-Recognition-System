version: '3.8'

services:
  emotion-ai:
    build: .
    ports:
      - "5000:5000"
    devices:
      - /dev/video0:/dev/video0 # Camera access
    environment:
      - PYTHONUNBUFFERED=1
      - EMOTION_LOG_LEVEL=INFO
    volumes:
      - ./models:/app/models
      - ./screenshots:/app/screenshots
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
