[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-emotion-recognition"
version = "2.0.0"
description = "Real-time facial emotion recognition using deep learning"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mangesh Raut", email = "mangeshraut712@gmail.com"}
]
maintainers = [
    {name = "Mangesh Raut", email = "mangeshraut712@gmail.com"}
]
keywords = [
    "emotion-recognition",
    "facial-expression",
    "deep-learning",
    "computer-vision",
    "tensorflow",
    "opencv",
    "mediapipe",
    "cnn",
    "real-time",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.10"

dependencies = [
    "tensorflow>=2.15.0,<3.0.0",
    "keras>=3.0.0",
    "opencv-python>=4.9.0",
    "mediapipe>=0.10.9",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "Pillow>=10.2.0",
    "h5py>=3.10.0",
    "imutils>=0.5.4",
]

[project.optional-dependencies]
web = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
all = [
    "face-emotion-recognition[web,dev]",
]

[project.urls]
Homepage = "https://github.com/mangeshraut712/Real-Time-Face-Emotion-Recognition-System"
Documentation = "https://github.com/mangeshraut712/Real-Time-Face-Emotion-Recognition-System#readme"
Repository = "https://github.com/mangeshraut712/Real-Time-Face-Emotion-Recognition-System.git"
Issues = "https://github.com/mangeshraut712/Real-Time-Face-Emotion-Recognition-System/issues"

[project.scripts]
emotion-gui = "run_gui:main"
emotion-web = "run_web:main"
emotion-train = "train:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.setuptools.package-data]
"*" = ["*.xml", "*.keras", "*.hdf5", "*.h5"]

# ============================================
# Ruff Configuration (Fast Python Linter)
# ============================================
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    # "DTZ",  # flake8-datetimez (Disabled: using local time is intentional)
    "T10",    # flake8-debugger
    "EXE",    # flake8-executable
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "C901",   # too complex
    "ARG001", # unused function argument
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG"]

[tool.ruff.lint.isort]
known-first-party = ["src", "config"]

# ============================================
# MyPy Configuration
# ============================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "mediapipe.*",
    "tensorflow.*",
    "keras.*",
]
ignore_missing_imports = true

# ============================================
# Pytest Configuration
# ============================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

# ============================================
# Coverage Configuration
# ============================================
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
